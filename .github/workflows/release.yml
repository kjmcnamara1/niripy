name: Create Release

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  release:
    name: Create Github Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
