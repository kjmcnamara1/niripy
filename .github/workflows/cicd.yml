name: Master CI/CD

on:
  push:
    tags: ["v*.*.*"]

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  release:
    needs: [quality]
    uses: ./.github/workflows/release.yml
    # secrets: inherit

  pypi:
    needs: [release]
    uses: ./.github/workflows/pypi.yml
    # secrets: inherit

  aur:
    needs: [release]
    uses: ./.github/workflows/aur.yml
    # secrets: inherit

  docs:
    needs: [release]
    uses: ./.github/workflows/docs.yml
    # secrets: inherit
