runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.10.2"
        enable-cache: true

    - name: Set up Python
      run: uv python install
      shell: bash

    - name: Install dependencies
      run: uv sync --locked --all-groups
      shell: bash
